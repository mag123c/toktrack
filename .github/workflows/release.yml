name: Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g., v0.1.7)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: toktrack-darwin-arm64
            brew: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: toktrack-darwin-x64
            brew: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: toktrack-linux-x64
            brew: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: toktrack-linux-arm64
            cross: true
            brew: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: toktrack-linux-musl-x64
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: toktrack-linux-musl-arm64
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: toktrack-win32-x64.exe

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (cargo)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Smoke test
        if: matrix.os != 'windows-latest'
        run: |
          file target/${{ matrix.target }}/release/toktrack
          test -x target/${{ matrix.target }}/release/toktrack

      - name: Prepare artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cp target/${{ matrix.target }}/release/toktrack ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Prepare artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cp target/${{ matrix.target }}/release/toktrack.exe ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Package tar.gz for Homebrew
        if: matrix.brew
        env:
          COPYFILE_DISABLE: 1
        run: |
          tar czf ${{ matrix.artifact }}.tar.gz -C target/${{ matrix.target }}/release toktrack
          shasum -a 256 ${{ matrix.artifact }}.tar.gz

      - name: Upload tar.gz artifact
        if: matrix.brew
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}.tar.gz
          path: ${{ matrix.artifact }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Prepare npm package
        run: |
          mkdir -p npm/bin
          cp artifacts/toktrack-darwin-arm64/toktrack-darwin-arm64 npm/bin/
          cp artifacts/toktrack-darwin-x64/toktrack-darwin-x64 npm/bin/
          cp artifacts/toktrack-linux-x64/toktrack-linux-x64 npm/bin/
          cp artifacts/toktrack-linux-arm64/toktrack-linux-arm64 npm/bin/
          cp artifacts/toktrack-linux-musl-x64/toktrack-linux-musl-x64 npm/bin/
          cp artifacts/toktrack-linux-musl-arm64/toktrack-linux-musl-arm64 npm/bin/
          cp artifacts/toktrack-win32-x64.exe/toktrack-win32-x64.exe npm/bin/
          chmod +x npm/bin/*

      - name: Publish to npm
        run: cd npm && npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  bump-homebrew:
    name: Bump Homebrew Formula
    needs: release
    uses: ./.github/workflows/bump-homebrew.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit
