name: Close stale issues and pull requests

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: stale
          stale-issue-message: >
            This issue has been inactive for 30 days and is now marked as stale.
            It will be closed in 7 days if there is no further activity.
          close-issue-message: >
            Closed due to inactivity. Feel free to reopen if this is still relevant.
          exempt-issue-labels: pinned,keep

          days-before-pr-stale: 60
          days-before-pr-close: 14
          stale-pr-label: stale
          stale-pr-message: >
            This pull request has been inactive for 60 days and is now marked as stale.
            It will be closed in 14 days if there is no further activity. A comment or a
            new commit is enough to keep it open.
          close-pr-message: >
            Closed due to inactivity. The branch is untouched — reopen it or open a new
            pull request whenever you want to pick this back up.
          # release-please keeps its PR open by design until a maintainer cuts the
          # release by hand, so inactivity there is not a signal to close.
          exempt-pr-labels: "autorelease: pending,dependencies"
